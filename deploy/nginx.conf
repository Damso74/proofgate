# ProofGate — static single-page proof console.
#
# Serves `dist/` only. No API, no upstream application, no secret.
# The page performs no network call at runtime: everything is bundled.

server {
    listen 80;
    server_name proofgate.example.com;          # <-- replace
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proofgate.example.com;          # <-- replace

    ssl_certificate     /etc/letsencrypt/live/proofgate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proofgate.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/proofgate;
    index index.html;

    # Le bundle est entièrement autonome : aucune source externe n'est nécessaire.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
        always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hashés par Vite : immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Application à une seule route : tout retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
