<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Treasury Drip Agent — ProofGate evidence console</title>
  <desc id="desc">Safe-scoped treasury execution through KeeperHub, independently verified onchain.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1728" />
      <stop offset="0.52" stop-color="#070b14" />
      <stop offset="1" stop-color="#060910" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(977 103) rotate(133) scale(443 394)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a3e635" stop-opacity="0.18" />
      <stop offset="1" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94a3b8" fill-opacity="0.09" />
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)" />
  <rect width="1200" height="630" rx="28" fill="url(#glow)" />
  <rect width="1200" height="630" rx="28" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#1e293b" stroke-width="2" />

  <g transform="translate(70 58)">
    <path d="M28 2 51 12v18c0 14-9.5 25.8-23 29C14.5 55.8 5 44 5 30V12L28 2Z" fill="none" stroke="#a3e635" stroke-width="4" />
    <path d="m16 30 8 8 17-18" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="72" y="28" fill="#e8edf7" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">ProofGate</text>
    <text x="72" y="52" fill="#64748b" font-family="IBM Plex Mono, monospace" font-size="15">EVIDENCE CONSOLE FOR TREASURY DRIP AGENT</text>
  </g>

  <g transform="translate(70 182)">
    <rect width="210" height="34" rx="17" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-opacity="0.35" />
    <circle cx="19" cy="17" r="4" fill="#a3e635" />
    <text x="33" y="22" fill="#a3e635" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" letter-spacing="1">SEPOLIA · VERIFIED</text>

    <text y="102" fill="#e8edf7" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-3">An onchain agent that</text>
    <text y="178" fill="#8b9ab4" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-3">can prove what it did.</text>
    <text y="230" fill="#a9b5c9" font-family="Inter, Arial, sans-serif" font-size="23">Safe-scoped authority · exactly one KeeperHub execution · independent RPC proof</text>
  </g>

  <g transform="translate(70 510)">
    <g>
      <text y="25" fill="#e8edf7" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="700">0.1 USDC</text>
      <text y="51" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">primary onchain run</text>
    </g>
    <line x1="205" y1="0" x2="205" y2="58" stroke="#1e293b" stroke-width="2" />
    <g transform="translate(245)">
      <text y="25" fill="#e8edf7" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="700">1</text>
      <text y="51" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">KeeperHub execute</text>
    </g>
    <line x1="455" y1="0" x2="455" y2="58" stroke="#1e293b" stroke-width="2" />
    <g transform="translate(495)">
      <text y="25" fill="#e8edf7" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="700">0</text>
      <text y="51" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">retries</text>
    </g>
  </g>

  <g transform="translate(875 422)">
    <rect width="255" height="132" rx="16" fill="#0b1220" stroke="#a3e635" stroke-opacity="0.4" stroke-width="2" />
    <text x="22" y="32" fill="#64748b" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1">EXECUTION ROUTE</text>
    <text x="22" y="70" fill="#e8edf7" font-family="IBM Plex Mono, monospace" font-size="16">KeeperHub → Roles</text>
    <text x="22" y="99" fill="#e8edf7" font-family="IBM Plex Mono, monospace" font-size="16">Safe → USDC</text>
    <circle cx="225" cy="26" r="5" fill="#a3e635" />
  </g>
